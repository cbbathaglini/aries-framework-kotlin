plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'org.hyperledger.ariesproject'
    compileSdk 36

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    defaultConfig {
        applicationId "org.hyperledger.ariesproject"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        setDataBinding(true)
    }

}

dependencies {
    //implementation(name: 'anoncreds_uniffi-release', ext: 'aar')
    implementation project(path: ':ariesframework')

    //implementation("org.hyperledger:aries-framework-kotlin:0.58.8-SNAPSHOT") {
    //    exclude group: "ch.qos.logback", module: "logback-classic"
    //}

    implementation("org.hyperledger:anoncreds-uniffi:1.0.3-SNAPSHOT")
    //implementation project(':libraryanoncredsuniffi')

    implementation("org.jetbrains.kotlinx:kotlinx-datetime:0.5.0")
//    implementation("org.hyperledger:aries-framework-kotlin:2.1.0")
    //implementation("org.hyperledger:anoncreds_uniffi:0.1.1-wrapper.1")

    implementation 'com.otaliastudios:cameraview:2.7.2'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.zxing:core:3.5.3'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation "org.conscrypt:conscrypt-android:2.5.2"
    implementation "org.openjsse:openjsse:1.1.0"
    implementation "org.slf4j:slf4j-simple:1.7.36"

    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3"
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
